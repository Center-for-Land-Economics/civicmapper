name: Backend (dev) deploy
on:
  push:
    branches: [ "develop" ]
    paths: [ "api/**", ".github/workflows/deploy-backend-dev.yml" ]
  workflow_dispatch: {}
permissions: { id-token: write, contents: read }
jobs:
  build-push-deploy:
    # CLE-specific deploy/ops job — skips automatically on forks.
    if: github.repository_owner == 'Center-for-Land-Economics'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name acrcivicmapperdev

      - name: Build & push image
        run: |
          IMAGE=acrcivicmapperdev.azurecr.io/civicmapper-api:${{ github.sha }}
          docker build -t $IMAGE ./api
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Container Apps
        run: |
          az containerapp update -g rg-civicmapper-dev -n api-civicmapper-dev --image "$IMAGE"

